[package]
name = "wasmi"
version.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/wasmi/"
description = "WebAssembly interpreter"
authors.workspace = true
repository.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = [
    "benches/wat",
    "benches/wasm",
    "tests/spec/testsuite",
    "**.wast",
]

[dependencies]
wasmi_core = { workspace = true }
wasmi_collections = { workspace = true }
wasmi_ir = { workspace = true }
wasmparser = { workspace = true, features = [] }
wat = { workspace = true, optional = true }
spin = { version = "0.9", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "rwlock",
] }
# PoC meta-tracing JIT tier (feature `majit-jit`). The `majit` crates live in a
# separate workspace one level up, so these are cross-workspace path deps.
majit-ir = { path = "../../../majit/majit-ir", optional = true }
majit-macros = { path = "../../../majit/majit-macros", optional = true }
majit-metainterp = { path = "../../../majit/majit-metainterp", default-features = false, optional = true }

[dev-dependencies]
assert_matches = "1.5"
criterion = { version = "0.5", default-features = false }
# `.wat` -> wasm in-process for the `majit-jit` prepass tests (always available
# in test builds, independent of the optional `wat` runtime feature).
wat = { workspace = true }

[features]
default = ["stable", "std", "wat", "validate", "memory64", "auto-dispatch"]
std = [
    "wasmi_ir/std",
    "wasmi_core/std",
    "wasmi_collections/std",
    "wasmparser/std",
    "spin/std",
]
hash-collections = [
    "wasmi_collections/hash-collections",
    "wasmparser/hash-collections",
]
prefer-btree-collections = [
    "wasmi_collections/prefer-btree-collections",
    "wasmparser/prefer-btree-collections",
]
wat = ["dep:wat", "std"]
simd = ["wasmi_core/simd", "wasmi_ir/simd", "wasmparser/simd"]
memory64 = ["wasmi_core/memory64", "wasmi_ir/memory64"]
validate = ["wasmparser/validate", "wasmparser/features"]
stable = []
unstable = []
deterministic = ["wasmi_core/deterministic"]
debug = ["wasmi_ir/debug"]

# Automatically selects the dispatch scheme based on the compilation target.
#
# When enabled, Wasmi uses its (faster) tail-call based dispatch only on targets
# that are known to support LLVM tail calls and are compiled with an optimizing
# opt-level, and otherwise falls back to the portable dispatch scheme.
#
# Enabling `portable-dispatch` always overrides this feature.
auto-dispatch = []
# Enables a portable dispatch scheme that avoids tail-call reliance.
# Recommended for targets without stable or guaranteed tail-call support.
portable-dispatch = []
# Enables an indirect dispatch scheme using op-codes instead of
# embedded function pointers for more compact bytecode.
indirect-dispatch = ["wasmi_ir/slot16"]

# PoC: meta-tracing JIT tier built on the in-repo `majit` framework. Additive
# and off by default; the only hot-path edit is one cfg block in `func.rs`.
# Requires `indirect-dispatch` so the prepass can decode the op stream (the
# default stream encodes raw handler pointers, not decodable op-codes).
majit-jit = [
    "std",
    "indirect-dispatch",
    "dep:majit-ir",
    "dep:majit-macros",
    "dep:majit-metainterp",
    "majit-metainterp/cranelift",
]

# Enables extra checks performed during Wasmi bytecode execution.
#
# These checks are unnecessary as long as Wasmi translation works as intended.
# If Wasmi translation invariants are broken due to bugs, these checks prevent
# Wasmi execution to exhibit undefined behavior (UB) in certain cases.
#
# Expected execution overhead is upt to 20%, if enabled.
#
# - Enable if your focus is on safety.
# - Disable if your focus is on execution speed.
extra-checks = []
# Forces usage of `libm` for implementations of certain Wasm operators.
# This mostly is used for testing the `libm` based Wasmi implementation.
libm = ["wasmi_core/libm"]

[[bench]]
name = "benches"
harness = false

# Micro-benchmark for the `majit-jit` meta-tracing tier. Needs `wat` to build the
# workload modules in-process and `majit-jit` for the tier under test.
[[example]]
name = "majit_bench"
required-features = ["majit-jit", "wat"]

[package.metadata.docs.rs]
features = ["std", "wat", "simd"]
